<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Acesso à conta — TADALAS BURGUER</title>
    <link rel="icon" href="/assets/images/tadalas-logo.png" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/commerce.css" />
    <script type="module" src="/js/recovery.js"></script>
  </head>
  <body>
    <main class="recovery-card">
      <p class="eyebrow">TADALAS BURGUER</p>
      <h1 id="recovery-title">RECUPERE SEU ACESSO.</h1>
      <form id="recovery-form">
        <div id="recovery-email-field">
          <label for="recovery-email">Seu e-mail</label
          ><input
            type="email"
            id="recovery-email"
            autocomplete="email"
            maxlength="100"
          />
        </div>
        <div id="recovery-passwords" hidden>
          <label for="recovery-password">Nova senha (12 a 128 caracteres)</label
          ><input
            type="password"
            id="recovery-password"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
          /><label for="recovery-confirm">Confirme a nova senha</label
          ><input
            type="password"
            id="recovery-confirm"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
          />
        </div>
        <button type="submit" id="recovery-submit" class="button">
          Continuar
        </button>
      </form>
      <p id="recovery-message" class="recovery-message" role="status"></p>
      <a class="text-link" href="/login/">Voltar para o login ↗</a>
    </main>
  </body>
</html>
